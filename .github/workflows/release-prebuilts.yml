name: Release Prebuilts

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: release-prebuilts
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-release:
    name: Ensure Rolling Release Exists
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure continuous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="continuous"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Creating rolling release '$TAG'..."
            gh release create "$TAG" \
              --title "CAVA Prebuilds" \
              --notes "Automated rolling prebuilt binaries and development libraries (libcava) for CAVA across Linux distributions." \
              --prerelease=false \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          else
            echo "Rolling release '$TAG' already exists."
          fi

  build-prebuilts:
    name: Build prebuilts (${{ matrix.distro }})
    needs: prepare-release
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            container: ~
          - distro: fedora
            container: fedora:latest
          - distro: arch
            container: archlinux:base-devel
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies (Ubuntu)
        if: matrix.distro == 'ubuntu'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential autoconf automake autoconf-archive libtool \
            libfftw3-dev libasound2-dev libncursesw5-dev libpulse-dev \
            libiniparser-dev libpipewire-0.3-dev libsndio-dev libsdl2-dev \
            pkg-config git

      - name: Install Build Dependencies (Fedora)
        if: matrix.distro == 'fedora'
        run: |
          set -euo pipefail
          dnf install -y \
            gcc gcc-c++ automake autoconf autoconf-archive libtool make \
            fftw3-devel alsa-lib-devel ncurses-devel pulseaudio-libs-devel \
            iniparser-devel pipewire-devel SDL2-devel pkgconf gh git tar

      - name: Install Build Dependencies (Arch)
        if: matrix.distro == 'arch'
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            git github-cli autoconf-archive automake autoconf libtool make gcc \
            fftw ncurses alsa-lib iniparser pipewire libpulse sdl2 sndio pkgconf tar

      - name: Build CAVA Executable
        run: |
          set -euo pipefail
          ./autogen.sh
          ./configure --prefix=/usr
          make -j"$(nproc)"

      - name: Build libcava and Stage Artifacts
        run: |
          set -euo pipefail
          DESTDIR="$PWD/stage" make install

          # Build libcava shared and static libraries from cavacore
          mkdir -p stage/usr/lib/pkgconfig stage/usr/include/cava
          gcc -fPIC -shared -O3 cavacore.c -o stage/usr/lib/libcava.so -lfftw3 -lm
          gcc -fPIC -c -O3 cavacore.c -o cavacore.o
          ar rcs stage/usr/lib/libcava.a cavacore.o

          # Install C/C++ development headers
          cp cavacore.h stage/usr/include/cavacore.h
          cp cavacore.h stage/usr/include/cava/cavacore.h

          # Version info
          CAVA_VERSION="0.10.4"
          if [[ -f version ]]; then
            CAVA_VERSION="$(tr -d '[:space:]' < version)"
          fi

          # Generate pkg-config files for libcava and cava
          cat << 'EOF' > stage/usr/lib/pkgconfig/libcava.pc
prefix=/usr
exec_prefix=${prefix}
libdir=${exec_prefix}/lib
includedir=${prefix}/include

Name: libcava
Description: CAVA audio visualizer core library
Version: @CAVA_VERSION@
Libs: -L${libdir} -lcava -lfftw3 -lm
Cflags: -I${includedir} -I${includedir}/cava
EOF
          sed -i "s/@CAVA_VERSION@/${CAVA_VERSION}/g" stage/usr/lib/pkgconfig/libcava.pc
          cp stage/usr/lib/pkgconfig/libcava.pc stage/usr/lib/pkgconfig/cava.pc

          # Assemble dist root directory
          mkdir -p dist/root/bin dist/root/lib dist/root/include
          cp -a stage/usr/bin/* dist/root/bin/
          cp -a stage/usr/include/* dist/root/include/
          cp -a stage/usr/lib/* dist/root/lib/
          if [ -d stage/usr/lib64 ]; then
            cp -a stage/usr/lib64/* dist/root/lib/ || true
          fi

          # Create distribution tarball
          ARCH="$(uname -m)"
          TARBALL="cava-${ARCH}-${{ matrix.distro }}.tar.gz"
          STANDALONE="cava-${ARCH}-${{ matrix.distro }}"

          mkdir -p dist/out
          tar -C dist/root -czf "dist/out/${TARBALL}" bin include lib
          cp stage/usr/bin/cava "dist/out/${STANDALONE}"

          echo "TARBALL_PATH=dist/out/${TARBALL}" >> "$GITHUB_ENV"
          echo "STANDALONE_PATH=dist/out/${STANDALONE}" >> "$GITHUB_ENV"

      - name: Upload Prebuilt Assets to Rolling Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="continuous"
          gh release upload "$TAG" "$TARBALL_PATH" "$STANDALONE_PATH" --repo "$GITHUB_REPOSITORY" --clobber
